# Copy this file into each private package repo (e.g. drogatechnology/postman-generator)
# at .github/workflows/notify-satis.yml
#
# It fires on every version tag push and tells the drogatechnology/satis repo to
# rebuild immediately, instead of relying on the 6-hour scheduled safety net.
#
# Requires a repo secret SATIS_DISPATCH_TOKEN on THIS package repo: a fine-grained
# GitHub PAT with "Contents: read and write" + "Actions: read and write" on the
# drogatechnology/satis repo only. Set it as a repo-level secret, e.g.:
#
#   gh secret set SATIS_DISPATCH_TOKEN --repo drogatechnology/<this-repo> --body <token>
#
# (On GitHub Free, org-level secrets are only delivered to public repos, so private
# package repos must set the secret per repo. If the org is upgraded to Team/Enterprise,
# an org-level secret scoped to all package repos can replace this per-repo step.)

name: Notify Satis on release

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger drogatechnology/satis rebuild
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SATIS_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/drogatechnology/satis/dispatches \
            -d '{"event_type":"package-updated"}'
